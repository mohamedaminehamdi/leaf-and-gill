<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Identify wild plants, trees and mushrooms offline, anywhere. Open-source AI that runs on your phone.">
<meta name="theme-color" content="#0b0f0c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f4" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Leaf &amp; Gill">
<title>Leaf &amp; Gill</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f4; --surface: #ffffff; --surface-2: #eef1ec; --border: rgba(16, 24, 16, .1);
    --text: #0f1a12; --muted: #4b5a4f; --accent: #1f7a45; --accent-ink: #ffffff;
    --danger: #b42318; --danger-bg: #fdecea; --warn-bg: #fff6e0; --warn: #8a5a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f0c; --surface: #121813; --surface-2: #1a221c; --border: rgba(255, 255, 255, .09);
      --text: #eef3ee; --muted: #a3b2a6; --accent: #4ade80; --accent-ink: #052e16;
      --danger: #ff8a7a; --danger-bg: #2a1210; --warn-bg: #2a2110; --warn: #f5c76b;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; letter-spacing: -.02em; }
  .brand img { width: 32px; height: 32px; }
  .pill { font-size: 13px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; background: var(--surface); }
  .pill.ok { color: var(--accent); }
  h1 { font-size: clamp(28px, 7vw, 38px); line-height: 1.1; letter-spacing: -.03em; margin: 8px 0 8px; }
  .lede { color: var(--muted); margin: 0 0 20px; }
  .snap {
    display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; min-height: 72px;
    border: 0; border-radius: 20px; background: var(--accent); color: var(--accent-ink);
    font: inherit; font-size: 20px; font-weight: 700; cursor: pointer;
  }
  .snap[aria-disabled="true"] { opacity: .5; pointer-events: none; }
  .snap svg { width: 26px; height: 26px; }
  .snap:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .status { min-height: 24px; margin: 12px 2px; color: var(--muted); font-size: 15px; }
  progress { width: 100%; height: 8px; accent-color: var(--accent); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 16px; margin-top: 14px; }
  .photo { display: block; width: 100%; max-height: 320px; object-fit: cover; border-radius: 14px; }
  .banner { border-radius: 16px; padding: 14px 16px; margin-top: 14px; font-weight: 600; }
  .banner.danger { background: var(--danger-bg); color: var(--danger); border: 1px solid currentColor; }
  .banner.warn { background: var(--warn-bg); color: var(--warn); }
  .banner p { margin: 4px 0 0; font-weight: 400; }
  ol.matches { list-style: none; margin: 0; padding: 0; }
  .match { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 0; border-top: 1px solid var(--border); }
  .match:first-child { border-top: 0; padding-top: 4px; }
  .match b { font-size: 18px; }
  .sci { color: var(--muted); font-style: italic; font-size: 15px; }
  .pct { font-variant-numeric: tabular-nums; font-weight: 700; align-self: center; }
  .bar { grid-column: 1 / -1; height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; color: var(--danger); margin-left: 6px; font-style: normal; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 10px; }
  details summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
  details summary::-webkit-details-marker { display: none; }
  .match summary > span:first-child { display: flex; flex-direction: column; }
  .match .bar { display: block; }
  .about { margin: 10px 0 0; font-size: 15px; color: var(--muted); }
  .about a, .look { color: var(--muted); }
  .look { margin: 8px 0 0; font-size: 15px; }
  .trust { margin: 14px 0 4px; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); font-size: 15px; }
  .trust span { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
  .trust.confident { border-left: 5px solid var(--accent); }
  .trust.likely { border-left: 5px solid var(--warn); }
  .trust.unsure { border-left: 5px solid var(--muted); }
  .ghost { width: 100%; min-height: 52px; margin-top: 12px; border-radius: 14px; border: 1px solid var(--border);
    background: transparent; color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
  .ghost:disabled { color: var(--accent); }
  #finds summary { display: block; padding: 2px 0; }
  ul.finds { list-style: none; margin: 12px 0 0; padding: 0; }
  ul.finds li { display: flex; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--border); }
  ul.finds img { border-radius: 10px; object-fit: cover; }
  ul.finds span { display: flex; flex-direction: column; }
  footer { color: var(--muted); font-size: 13px; margin-top: 28px; text-align: center; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand"><img src="icons/icon.svg" alt="" width="32" height="32">Leaf &amp; Gill</div>
    <span class="pill" id="mode">Loading…</span>
  </header>

  <h1>What is that plant?</h1>
  <p class="lede">Snap a leaf, tree or mushroom. It's identified on your phone, offline, then back in your pocket.</p>

  <label class="snap" id="snap" for="camera" aria-disabled="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="4"/></svg>
    Identify
  </label>
  <input id="camera" type="file" accept="image/*" capture="environment">

  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div id="result"></div>
  <div id="finds"></div>

  <footer>
    Open-source AI: <a href="https://huggingface.co/imageomics/bioclip-2">BioCLIP 2</a> runs on your device. Photos never leave it.<br>
    Never eat anything based on an app.
  </footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
